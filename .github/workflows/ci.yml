name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # verify:seals 要拿锚定提交重算指纹，也要看得到 .seal.json 的历史；
          # actions/checkout 默认 fetch-depth: 1 会让这三项全部降级成 warn（脚本会明说没查）
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: 存证门禁（锚定重算 / 账本防删 / 只追加）
        run: npm run verify:seals

      - name: 接口响应判定
        run: npm run verify

      - name: 配额时区与 Origin 校验
        run: npm run verify:functions

      - name: 网页校验器与协议实现对拍
        run: npm run verify:web

      - name: 补齐 AFTER 接口（假 GitHub 全分支）
        run: npm run verify:after

      - name: 构建（内含 verify:seals）
        run: npm run build

      - name: 产物齐不齐
        run: |
          test -f dist/404.html
          test -f dist/index.html
          test -f dist/sitemap-index.xml
          grep -q admin dist/sitemap-0.xml && { echo "sitemap 里不该有 /admin"; exit 1; } || true
