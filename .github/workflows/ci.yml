name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # verify:seals 要拿锚定提交重算指纹，也要看得到 .seal.json 的历史；
          # actions/checkout 默认 fetch-depth: 1 会让这三项全部降级成 warn（脚本会明说没查）
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          # 先不带 npm 缓存：setup-node 的缓存若由另一个 npm 版本写入，
          # 会在 npm ci 里炸成 ENOTEMPTY/EEXIST 一类的错，而日志只显示「npm ci 失败」。
          # 这一次运行是为了排除该变量，稳定后可以再把 cache: npm 加回来。

      - name: 构建环境自报（npm ci 红的时候先看这几行）
        run: |
          node -v
          npm -v
          echo "registry = $(npm config get registry)"
          echo "engine-strict = $(npm config get engine-strict)"
          echo "cache = $(npm config get cache)"
          git log --oneline -1
          echo "lock 条目数 = $(python3 -c "import json;print(len(json.load(open('package-lock.json'))['packages']))")"
          npm ci --dry-run

      - run: npm ci

      - name: 存证门禁（锚定重算 / 账本防删 / 只追加）
        run: npm run verify:seals

      - name: 接口响应判定
        run: npm run verify

      - name: 配额时区与 Origin 校验
        run: npm run verify:functions

      - name: 网页校验器与协议实现对拍
        run: npm run verify:web

      - name: 补齐 AFTER 接口（假 GitHub 全分支）
        run: npm run verify:after

      - name: 构建（内含 verify:seals）
        run: npm run build

      - name: 产物齐不齐
        run: |
          test -f dist/404.html
          test -f dist/index.html
          test -f dist/sitemap-index.xml
          grep -q admin dist/sitemap-0.xml && { echo "sitemap 里不该有 /admin"; exit 1; } || true
